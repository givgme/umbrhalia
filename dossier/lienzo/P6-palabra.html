<style>

a{color:#F4F4F2}a:hover{color:#A3A3A1}

<body>
<div id="dc-root"><div style="width: 360px; height: 800px; box-sizing: border-box; background: #000000; color: #F4F4F2; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 0 16px">
  <div style="height: 56px; display: flex; align-items: center; gap: 10px">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="#F4F4F2"></circle><circle cx="14" cy="11" r="9.2" fill="#000000"></circle><circle cx="11" cy="11" r="9" fill="none" stroke="#7A7A78" stroke-width="1"></circle></svg>
    <span style="font-size: 13px; color: #A3A3A1">Paso 2 de 6</span>
  </div>
  <label for="palabra" style="margin-top: 72px; font-size: 30px; font-weight: 300; line-height: 1.25">Si tuvieras que nombrar ese momento con una sola palabra…</label>
  <input id="palabra" type="text" autocomplete="off" maxlength="24" value="" aria-describedby="ayuda" style="margin-top: 40px; background: none; border: 0; border-bottom: 1.5px solid #7A7A78; color: #F4F4F2; font: inherit; font-size: 40px; font-weight: 300; text-align: center; padding: 8px 0; width: 100%; box-sizing: border-box">
  <p id="ayuda" aria-live="polite" style="margin: 14px 0 0; font-size: 14px; color: #A3A3A1; text-align: center; min-height: 20px">Una palabra. La que llegue primero.</p>
  <div style="margin-top: auto; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center">
    <a href="P5-pregunta.html" style="font-size: 15px; min-height: 48px; display: flex; align-items: center; color: #A3A3A1">Atrás</a>
    
    
      <span aria-disabled="true" style="border: 1px solid #3D3D3B; color: #7A7A78; font-size: 16px; min-height: 48px; padding: 0 28px; display: flex; align-items: center; box-sizing: border-box">Seguir</span>
    
  </div>
</div></div><!--/dc-root-->
<script>
/* Intérprete mínimo de la plantilla del lienzo: {{expr}}, <sc-for list as>, <sc-if value>,
   on*="{{fn}}" y setState. Sin dependencias. Reutiliza el DOM ya presente (prerenderizado). */
var DC = (function () {
  var root, tpl, comp;
  function ev(expr, scope) {
    try { return Function('s', 'with(s){return (' + expr + ');}')(scope); } catch (e) { return ''; }
  }
  var RE = /\{\{([\s\S]+?)\}\}/g;
  function interp(str, scope) {
    return str.replace(RE, function (_, e) { var v = ev(e, scope); return v == null ? '' : String(v); });
  }
  function whole(str) { var m = /^\s*\{\{([\s\S]+?)\}\}\s*$/.exec(str); return m ? m[1] : null; }
  function bind(el, type, fn) {
    el.__h = el.__h || {};
    if (!(type in el.__h)) el.addEventListener(type, function (e) { var f = el.__h[type]; if (f) f(e); });
    el.__h[type] = fn;
  }
  function evType(el, name) {
    var t = name.slice(2).toLowerCase();
    if (t === 'change' && /^(INPUT|TEXTAREA)$/.test(el.tagName) && !/^(checkbox|radio)$/.test(el.type)) t = 'input';
    return t;
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.data, scope))); return; }
    if (node.nodeType !== 1) return;
    var n = node.localName;
    if (n === 'sc-for') {
      var list = ev(whole(node.getAttribute('list')), scope) || [], as = node.getAttribute('as');
      for (var i = 0; i < list.length; i++) {
        var s = Object.create(scope); s[as] = list[i];
        kids(node, s, out);
      }
      return;
    }
    if (n === 'sc-if') { if (ev(whole(node.getAttribute('value')), scope)) kids(node, scope, out); return; }
    var el = document.createElementNS(node.namespaceURI, n);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a];
      if (/^hint-/.test(at.name)) continue;
      if (/^on/i.test(at.name) && whole(at.value)) { bind(el, evType(el, at.name), ev(whole(at.value), scope)); continue; }
      el.setAttribute(at.name, interp(at.value, scope));
    }
    var c = []; kids(node, scope, c);
    c.forEach(function (k) { el.appendChild(k); });
    out.push(el);
  }
  function kids(node, scope, out) {
    var src = node.content || node;
    for (var k = src.firstChild; k; k = k.nextSibling) build(k, scope, out);
  }
  function syncAttrs(o, n) {
    for (var i = o.attributes.length - 1; i >= 0; i--) if (!n.hasAttribute(o.attributes[i].name)) o.removeAttribute(o.attributes[i].name);
    for (var j = 0; j < n.attributes.length; j++) {
      var a = n.attributes[j];
      if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
      if (a.name === 'value' && 'value' in o && o.value !== a.value) o.value = a.value;
    }
    if (n.__h) for (var t in n.__h) bind(o, t, n.__h[t]);
  }
  function morph(o, nList) {
    var oc = Array.prototype.slice.call(o.childNodes);
    for (var i = 0; i < Math.max(oc.length, nList.length); i++) {
      var a = oc[i], b = nList[i];
      if (!a) { o.appendChild(b); continue; }
      if (!b) { o.removeChild(a); continue; }
      if (a.nodeType === b.nodeType && a.nodeName === b.nodeName && a.namespaceURI === b.namespaceURI) {
        if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; }
        else if (a.nodeType === 1) { syncAttrs(a, b); morph(a, Array.prototype.slice.call(b.childNodes)); }
        else o.replaceChild(b, a);
      } else o.replaceChild(b, a);
    }
  }
  function render() {
    var out = []; kids(tpl, comp.renderVals(), out);
    morph(root, out);
  }
  window.DCLogic = function (p) { this.props = p || {}; this.state = {}; };
  DCLogic.prototype.setState = function (u) {
    Object.assign(this.state, typeof u === 'function' ? u(this.state) : u);
    render();
  };
  return {
    mount: function (rootEl, template, Comp) {
      root = rootEl; tpl = document.createElement('template'); tpl.innerHTML = template;
      comp = new Comp({}); render();
    }
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { palabra: '' }; }
  renderVals() {
    const p = this.state.palabra;
    const dos = p.trim().split(/\s+/).length > 1;
    const lista = p.trim().length > 0 && !dos;
    let ayuda = 'Una palabra. La que llegue primero.';
    if (dos) ayuda = 'Solo una. Si son dos, elige la que pese más.';
    return { palabra: p, ayuda, lista, noLista: !lista, escribir: (e) => this.setState({ palabra: e.target.value }) };
  }
}
DC.mount(document.getElementById("dc-root"), "<div style=\"width: 360px; height: 800px; box-sizing: border-box; background: #000000; color: #F4F4F2; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 0 16px\">\n  <div style=\"height: 56px; display: flex; align-items: center; gap: 10px\">\n    <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"9\" fill=\"#F4F4F2\"><\/circle><circle cx=\"14\" cy=\"11\" r=\"9.2\" fill=\"#000000\"><\/circle><circle cx=\"11\" cy=\"11\" r=\"9\" fill=\"none\" stroke=\"#7A7A78\" stroke-width=\"1\"><\/circle><\/svg>\n    <span style=\"font-size: 13px; color: #A3A3A1\">Paso 2 de 6<\/span>\n  <\/div>\n  <label for=\"palabra\" style=\"margin-top: 72px; font-size: 30px; font-weight: 300; line-height: 1.25\">Si tuvieras que nombrar ese momento con una sola palabra…<\/label>\n  <input id=\"palabra\" type=\"text\" autocomplete=\"off\" maxlength=\"24\" value=\"{{palabra}}\" onChange=\"{{escribir}}\" aria-describedby=\"ayuda\" style=\"margin-top: 40px; background: none; border: 0; border-bottom: 1.5px solid #7A7A78; color: #F4F4F2; font: inherit; font-size: 40px; font-weight: 300; text-align: center; padding: 8px 0; width: 100%; box-sizing: border-box\">\n  <p id=\"ayuda\" aria-live=\"polite\" style=\"margin: 14px 0 0; font-size: 14px; color: #A3A3A1; text-align: center; min-height: 20px\">{{ayuda}}<\/p>\n  <div style=\"margin-top: auto; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center\">\n    <a href=\"P5-pregunta.html\" style=\"font-size: 15px; min-height: 48px; display: flex; align-items: center; color: #A3A3A1\">Atrás<\/a>\n    <sc-if value=\"{{lista}}\" hint-placeholder-val=\"{{ false }}\">\n      <a href=\"P8-reglas.html\" style=\"background: #F4F4F2; color: #000000; text-decoration: none; font-size: 16px; min-height: 48px; padding: 0 28px; display: flex; align-items: center\">Seguir<\/a>\n    <\/sc-if>\n    <sc-if value=\"{{noLista}}\" hint-placeholder-val=\"{{ true }}\">\n      <span aria-disabled=\"true\" style=\"border: 1px solid #3D3D3B; color: #7A7A78; font-size: 16px; min-height: 48px; padding: 0 28px; display: flex; align-items: center; box-sizing: border-box\">Seguir<\/span>\n    <\/sc-if>\n  <\/div>\n<\/div>", Component);
</script>
</body>
</html>
